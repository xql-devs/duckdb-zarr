name: Community Extension Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag or 40-character commit hash to publish
        required: true
      ref_next:
        description: >-
          Optional commit/tag built for the upcoming DuckDB version (emitted as
          repo.ref_next so the community rebuild can serve it immediately on that
          DuckDB release).
        required: false

permissions:
  contents: read

jobs:
  descriptor:
    name: Render community descriptor
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ github.event.release.tag_name || inputs.ref }}
      RELEASE_REF_NEXT: ${{ inputs.ref_next }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync version from release tag
        # Cargo.toml/pyproject.toml/description.yml carry a development-
        # placeholder version (see docs/versioning.md); the tag is the real
        # source of truth. A workflow_dispatch ref may instead be a raw commit
        # hash (no tag to sync from), in which case the checked-in placeholder
        # is rendered as-is.
        run: |
          if [[ "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            uv run scripts/sync_release_version.py "$RELEASE_REF"
          else
            echo "RELEASE_REF '$RELEASE_REF' is not a vX.Y.Z tag; skipping version sync."
          fi

      - name: Render descriptor for release ref
        run: |
          args=(--ref "$RELEASE_REF"
                --out build/community-extensions/extensions/zarr/description.yml)
          if [ -n "$RELEASE_REF_NEXT" ]; then
            args+=(--ref-next "$RELEASE_REF_NEXT")
          fi
          uv run scripts/render_community_descriptor.py "${args[@]}"

      - name: Validate rendered descriptor
        run: |
          uv run scripts/check_release_ready.py \
            --description-path build/community-extensions/extensions/zarr/description.yml \
            --strict-community-ref

      - name: Upload descriptor artifact
        uses: actions/upload-artifact@v7
        with:
          name: zarr-community-extension-descriptor
          path: build/community-extensions/extensions/zarr/description.yml
